[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mzero"
version = "0.1.0"
description = "Zero-Configuration RAG Framework and Embeddable SDK for Python"
readme = "README.md"
authors = [{ name = "MZero Team", email = "info@mzero.ai" }]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0.0",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "chromadb>=0.4.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "jinja2>=3.1.0",
    "pypdf>=3.9.0",
    "python-docx>=0.8.11",
    "python-pptx>=0.6.21",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.24.0",
    "streamlit>=1.25.0",
]

[project.urls]
Homepage = "https://github.com/bala-2305/advanced_rag_pipeline"
Documentation = "https://github.com/bala-2305/advanced_rag_pipeline#readme"
Repository = "https://github.com/bala-2305/advanced_rag_pipeline.git"
Issues = "https://github.com/bala-2305/advanced_rag_pipeline/issues"

[project.optional-dependencies]
streamlit = [
    "streamlit>=1.25.0",
    "watchdog>=3.0.0",
]
full = [
    "qdrant-client>=1.6.0",
    "pymilvus>=2.3.0",
    "pytesseract>=0.3.10",
    "youtube-transcript-api>=0.6.0",
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0",
    "flask>=2.3.0",
    "streamlit>=1.25.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]
mzero = "mzero.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
